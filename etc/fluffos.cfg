###############################################################################
#  東方故事 MUD — FluffOS (v2026.x) 執行設定                                   #
#                                                                             #
#  這份設定取代根目錄的舊 config.cfg（MudOS 0.9.20 / FluffOS 2017 格式）。     #
#  FluffOS 2019 以後把許多原本是編譯期 #define 的行為改成這裡的執行期開關，     #
#  下面凡標示「相容」的項目都是為了讓 1990 年代的 TMI-2 系 mudlib 能照原本語意  #
#  運作，改動它們會改變既有 LPC 程式的行為。                                    #
#  所有路徑（除 mudlib directory 外）皆相對於 mudlib directory。               #
###############################################################################

name : 東方故事

# 綁定所有介面，讓容器外可以連進來
mud ip : 0.0.0.0
port number : 8888

mudlib directory : /mudlib
log directory : /log
include directories : /include

master file : /adm/obj/master
simulated efun file : /adm/obj/simul_efun
global include file : <globals.h>
debug log file : debug.log

default fail message : 什麼？
default error message : [1;33m你發現事情不大對了，但是又說不上來。[2;37;0m

#------------------------------------------------------------------------------
# 資源上限（沿用舊 config.cfg 的值）
#------------------------------------------------------------------------------
time to clean up : 600
time to reset : 900
time to swap : 300

maximum bits in a bitfield : 12000
maximum call depth : 150
# 注意：新版此欄位單位是「微秒」，與 2017 版的 eval cost 不同義
maximum evaluation cost : 300000000
maximum array size : 15000
maximum buffer size : 400000
maximum mapping size : 150000
inherit chain size : 30
maximum string length : 200000
maximum read file size : 200000
maximum byte transfer : 200000

hash table size : 7001
object table size : 1501
living hash table size : 256
maximum users : 50
evaluator stack size : 65536
compiler stack size : 200

gametick msec : 100
heartbeat interval msec : 1000

#------------------------------------------------------------------------------
# 舊 mudlib 相容開關
#------------------------------------------------------------------------------
# 相容：MudOS 0.9.20 兩者皆 #undef，即「舊 explode 行為」
sane explode string : 0
reversible explode string : 0

# 相容：舊碼大量依賴寬鬆型別與負索引語意
old type behavior : 1
old range behavior : 1
warn old range behavior : 0
suppress argument warnings : 1
call other type check : 0
call other warn : 0

# 相容：舊碼在 call_out 回呼中使用 this_player()
this_player in call_out : 1

# master.c 有 error_handler()（adm/obj/master.c:260），交給 mudlib 處理執行期錯誤
mudlib error handler : 1

# 相容：reset 行為比照舊驅動，固定間隔、非 lazy
no resets : 0
lazy resets : 0
randomized resets : 1

# 相容：sort_array 的比較函式舊碼只回傳 0/-1，需要穩定排序
sane sorting : 1

# 相容：TMI 系 lib 直接對非互動物件 write()
noninteractive stderr write : 1
trap crashes : 1

no ansi : 0
strip before process input : 0
interactive catch tell : 0
receive snoop : 1
snoop shadowed : 0
reverse defer : 0
enable_commands call init : 0
sprintf add_justified ignore ANSI colors : 1
# 這個 mudlib 的房間 create() 用 call_out("reset", 0)（見 /std/room/room.c），
# 連鎖載入一整片相連的房間時很容易疊過十層，超過就整個載入失敗。
# 舊驅動沒有這個限制，放寬到 100。
call_out(0) nest level : 100

has console : 1
trace : 1
trace code : 0
trace lpc execution context : 0
trace lpc instructions : 0

#------------------------------------------------------------------------------
# Telnet 擴充：舊 client 居多，僅保留最無害的
#------------------------------------------------------------------------------
enable mxp : 0
enable gmcp : 1
enable zmp : 0
enable mssp : 1
enable msp : 0
enable msdp : 0
